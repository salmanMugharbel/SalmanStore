{% extends 'base.html' %}

{% block content %}

<div class="page-head">
    <div>
        <h2>Place Order</h2>
        <p class="muted">You are ordering <strong>{{ product.name }}</strong> for ${{ product.price }}.</p>
    </div>
</div>

<div class="form-shell">
    <form class="app-form" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button class="btn-primary" type="submit">Submit Order</button>
            <a class="btn-secondary" href="{% url 'products' %}">Back to Products</a>
        </div>
    </form>
</div>

{% endblock %}
